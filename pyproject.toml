[project]
name = "speedons-shared" # nom de distribution (dans les packages Pip du venv)
version = "0.0.1"

[tool.setuptools]
packages = ["shared"] # nom de mon package (import shared)

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint.per-file-ignores] # ignore les imports inutilisés dans les fichiers __init__.py
"**/__init__.py" = ["F401"]